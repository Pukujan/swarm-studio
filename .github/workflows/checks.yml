name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# a new push to a pull request stops the run of the push before it (thirteen jobs, one a Mac, were queueing behind
# runs nobody would read); a run on main is never stopped, so every merge has its own result
concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # What a pull request touches decides which of the heavy jobs run (a skipped job counts as passed, so nothing waits
  # on it). A push to main or release/** runs everything, always. If this job itself fails, the jobs that wait on it
  # run too: a scope that cannot be worked out never drops a gate.
  #   platform  launcher.py, bridge*.py, plugin.yaml, engine/, server/, scripts/, tests/, this workflow   -> checks-macos
  #   code      anything but docs (docs/, openspec/, *.md)                                              -> checks-windows
  #   web       web/, ui/, server/, the motion and gauge scripts and their notes, this workflow         -> motion-check, motion-parity, board-gauge
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.scope.outputs.platform }}
      code: ${{ steps.scope.outputs.code }}
      web: ${{ steps.scope.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            { echo platform=true; echo code=true; echo web=true; } >> "$GITHUB_OUTPUT"
            echo 'not a pull request: everything runs'; exit 0
          fi
          base=$(git rev-parse -q --verify HEAD^2 >/dev/null && git rev-parse HEAD^1 || echo "$BASE_SHA")
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/files.txt"
          echo 'changed:'; sed 's/^/  /' "$RUNNER_TEMP/files.txt"
          any() { if grep -Eq "$1" "$RUNNER_TEMP/files.txt"; then echo true; else echo false; fi; }
          platform=$(any '^(launcher[.]py|bridge[^/]*[.]py|plugin[.]yaml|engine/|server/|scripts/|tests/|[.]github/workflows/checks[.]yml$)')
          web=$(any '^(web/|ui/|server/|scripts/(board-gauge|gauge-reqlog|motion-check|motion-parity|walkthrough-fixtures)|docs/ux/motion/|[.]github/workflows/checks[.]yml$)')
          if grep -Eqv '^(docs/|openspec/|.*[.]md$)' "$RUNNER_TEMP/files.txt"; then code=true; else code=false; fi
          echo "platform=$platform code=$code web=$web"
          { echo "platform=$platform"; echo "code=$code"; echo "web=$web"; } >> "$GITHUB_OUTPUT"
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      # the next UI's build, made here as on every branch: main and pull requests carry no ui/dist/, only a release
      # does (docs/decisions/0018-next-ui-build-on-release.md); SWARM_NEED_UI makes the checks fail without it
      - run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
      # the image service's libraries (engine/imagetools): its prebuilt binary for this system, nothing compiled;
      # tests/images.test.mjs then runs against the real binary
      - run: npm ci --prefix engine/imagetools --ignore-scripts --no-audit --no-fund
      - run: bash scripts/check.sh
        env:
          SWARM_NEED_UI: '1'
      # the type check and the dependency rules (tools/dev: development only, never installed by the plugin)
      - run: npm ci --prefix tools/dev --no-audit --no-fund
      - run: npm run --prefix tools/dev typecheck
      - run: npm run --prefix tools/dev deps
      # no orphan code: every file under web/, engine/ and server/ is reached from something that runs (the page's
      # lists in server/page.mjs count); what was already unreached is in .dependency-cruiser-orphans-known.json
      - run: npm run --prefix tools/dev orphans
      - run: npm run --prefix tools/dev tokens:check
      # the next UI (ui/, docs/decisions/0013-react-ui-coexists.md): its type check and dependency rules, and its
      # build makes the one-document /next/ page (development only: the plugin installs none of it)
      # ui/'s own tests (the boards' tier manager, its fast-check properties): they import ui/'s dependencies
      - run: npm test --prefix ui
      - run: npm run --prefix tools/dev typecheck:ui
      - run: npm run --prefix tools/dev deps:ui
      # the next UI's orphans (knip, ui/knip.jsonc): no unused file, export or package
      - run: npm run --prefix tools/dev orphans:ui
      - run: npm run --prefix tools/dev ui:check
      # the vendored libraries are exactly what their npm tarballs build (scripts/vendor.mjs)
      - run: node scripts/vendor.mjs --check
  # the same checks on Windows, where the owner develops: git's autocrlf, Git Bash and Windows paths (issue #408)
  checks-windows:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # setup-python names it python.exe only; check.sh calls python3
      - run: command -v python3 || cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
      - run: python -m pip install --quiet pillow
      # the next UI's build, made here as on every branch: main and pull requests carry no ui/dist/, only a release
      # does (docs/decisions/0018-next-ui-build-on-release.md); SWARM_NEED_UI makes the checks fail without it
      - run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
      # the image service's libraries (engine/imagetools): its prebuilt binary for this system, nothing compiled;
      # tests/images.test.mjs then runs against the real binary
      - run: npm ci --prefix engine/imagetools --ignore-scripts --no-audit --no-fund
      - run: bash scripts/check.sh
        env:
          SWARM_NEED_UI: '1'
  # macOS, where nobody here has a machine (issue #405): the plugin installed the way a person installs it
  # (Hermes's own `hermes plugins install`, nothing built), its server started from that copy, the same checks
  # and audit gates, and what only a Mac shows (scripts/macos-check.mjs)
  # On this repository's own branches and on main it runs on the MacBook Pro self-hosted runner (macbookpro-swarm,
  # labels self-hosted + swarm-mac, one job at a time); a pull request from a fork never does (the repository is
  # public) and gets GitHub's macos-latest. The self-hosted runner keeps what a job leaves, so this job works in a
  # Hermes home and caches of its own under the runner's temp folder, installs nothing globally, uses the Godot the Mac has, and deletes what it made and stops what it started when it ends.
  checks-macos:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.platform == 'true') }}
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","swarm-mac"]') || 'macos-latest' }}
    timeout-minutes: 30
    steps:
      - if: ${{ runner.environment == 'self-hosted' }}
        run: |
          free_kb=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')
          echo "free disk: $((free_kb / 1048576)) GB"
          if [ "$free_kb" -lt 3145728 ]; then
            echo "::error::The runner has under 3 GB of disk free ($((free_kb / 1048576)) GB). Free some space on the Mac (the runner's _work and _cache folders, ~/.cache), then run this job again."
            exit 1
          fi
      - uses: actions/checkout@v4
      # a Hermes home of its own, under the runner's temp folder (TMPDIR-style /var/folders… paths on a Mac), and every
      # cache a tool would put in the person's home put there too
      - run: |
          {
            echo "HERMES_HOME=$RUNNER_TEMP/hermes"
            echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw"
            echo "npm_config_cache=$RUNNER_TEMP/npm"
            echo "PIP_CACHE_DIR=$RUNNER_TEMP/pip"
            echo "UV_CACHE_DIR=$RUNNER_TEMP/uv"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/xdg"
            # ports this job picks itself: the Mac has other servers on it (4391 answered as another app)
            echo "CHECK_PORT=$(python3 -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])")"
            echo "SWARM_STUDIO_PORT=$(python3 -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])")"
          } >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP" | tail -1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # (the hosted runner's setup-python installs a framework with sudo, which the self-hosted Mac must not: it uses
      # the python3 it has, in a venv under the temp folder)
      - if: ${{ runner.environment != 'self-hosted' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            py=$(command -v python3.12 || command -v python3 || echo /opt/homebrew/bin/python3)
            "$py" --version && "$py" -m venv "$RUNNER_TEMP/venv"
            echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet pillow
          else
            python -m pip install --quiet pillow
          fi
      # the next UI's build, made here as on every branch: main and pull requests carry no ui/dist/, only a release
      # does (docs/decisions/0018-next-ui-build-on-release.md); SWARM_NEED_UI makes the checks fail without it
      - run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
      # the image service's libraries (engine/imagetools): its prebuilt binary for this system, nothing compiled;
      # tests/images.test.mjs then runs against the real binary
      - run: npm ci --prefix engine/imagetools --ignore-scripts --no-audit --no-fund
      - run: bash scripts/check.sh
        env:
          SWARM_NEED_UI: '1'
      # what a release does before the catalog pins it: the build committed in this runner's own checkout, so the
      # copy Hermes installs below carries ui/dist/ exactly as a release's does (scripts/release-ui.mjs)
      # it runs even when check.sh failed, like the sections below, so the install is still checked
      # a push to main checks out the branch main, where the script refuses to commit; a pull request's checkout
      # is already detached. Detached here too, so main's own run installs the plugin as a pull request's does
      - if: ${{ !cancelled() }}
        run: git checkout --detach && node scripts/release-ui.mjs
      # the sections below each run even when one before them failed, so one run shows every Mac failure
      # Hermes as a person installs it on a Mac (its install.sh), at the release the plugin asks for
      # (plugin.yaml requires_hermes: v0.23.1, commit 3b42157), without its setup questions, browser or
      # computer-use driver; then this commit installed through it: Hermes clones it, scans it and copies it
      # into $HERMES_HOME/plugins/ (Hermes refuses a pip install of itself)
      - id: hermes
        if: ${{ !cancelled() }}
        run: |
          # Installed into this job's own home, on the self-hosted Mac too: Hermes records the absolute path of its
          # dependency environment, so a copy or clone of a kept install elsewhere is "outside this install" and
          # refuses to run (tried: an install kept per pinned release and cloned into each job's home). 2.8 GB, gone
          # when the job ends; the first step stops the job early where the disk could not hold it.
          curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/v0.23.1/scripts/install.sh -o "$RUNNER_TEMP/hermes-install.sh"
          bash "$RUNNER_TEMP/hermes-install.sh" --commit 3b421578588243f920886e6fe79a6faa87ea026e --hermes-home "$HERMES_HOME" --skip-setup --skip-browser --skip-computer-use
          echo "$HERMES_HOME/hermes-agent/.hermes/bin" >> "$GITHUB_PATH"
          du -sh "$HERMES_HOME" | tail -1; df -h "$RUNNER_TEMP" | tail -1
      - if: ${{ !cancelled() && steps.hermes.outcome == 'failure' }}
        run: tail -n 80 "$HERMES_HOME/logs/install.log" || true
      - id: install
        if: ${{ !cancelled() && steps.hermes.outcome == 'success' }}
        run: hermes plugins install "file://$GITHUB_WORKSPACE" --force --enable --yes-deps
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: hermes plugins list | tee "$RUNNER_TEMP/plugins.txt" && grep -q swarm-studio "$RUNNER_TEMP/plugins.txt"
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/macos-check.mjs tree "$HERMES_HOME/plugins/swarm-studio"
      # the installed copy's launcher starts its server (HOME, TMPDIR and $HERMES_HOME paths as on a Mac); both
      # Studios answer, the current one at / and the prebuilt next one at /next/
      - name: the installed server starts and serves / and /next/
        id: served
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        working-directory: ${{ env.HERMES_HOME }}/plugins/swarm-studio
        run: |
          python -c "import json, launcher; r = launcher.ensure_server(); print(json.dumps(r)); assert r.get('running'), r"
          token=$(cat "$HERMES_HOME/swarm-studio/token")
          # each reply read in full before it is searched (grep -q stopping early fails curl under pipefail)
          echo '· /'; home=$(curl -sf http://127.0.0.1:$SWARM_STUDIO_PORT/); grep -q '<title>Swarm Studio' <<< "$home"
          # /next/ is one document: its scripts and styles inlined (server/next.mjs), with the boot line written in
          echo '· /next/'; next=$(curl -sf http://127.0.0.1:$SWARM_STUDIO_PORT/next/); grep -q '<title>Swarm Studio' <<< "$next"; grep -q 'window.SWARM = ' <<< "$next"
          echo '· /api/state'; state=$(curl -sf -H "x-swarm-token: $token" http://127.0.0.1:$SWARM_STUDIO_PORT/api/state); grep -q '"app":"swarm-studio"' <<< "$state"
          pid=$(python -c "import json, sys; print(json.loads(sys.argv[1])['pid'])" "$state")
          kill "$pid"
      - if: ${{ !cancelled() && steps.served.outcome == 'failure' }}
        run: ls -la "$HERMES_HOME/swarm-studio"; cat "$HERMES_HOME"/swarm-studio/*.log 2>/dev/null || true
      # the film renderer's darwin ffmpeg and ffprobe: installed from the pinned packages and checked against
      # their SHA-256 for this Mac, and the other Mac's (arm64 / x64) fetched and checked too
      - if: ${{ !cancelled() }}
        run: node scripts/macos-check.mjs ffmpeg
      # the image service's libraries installed on first use into the data folder, as a Dock-opened studio does
      - if: ${{ !cancelled() }}
        run: node scripts/macos-check.mjs images
      # Godot as a Mac has it: the app, found without Homebrew on PATH
      # (the self-hosted Mac uses the Godot.app it has: nothing is installed on it)
      - id: godot
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ runner.environment }}" = self-hosted ]; then
            if [ -d /Applications/Godot.app ]; then echo 'using /Applications/Godot.app'; else echo '::warning::no Godot.app on this runner: the Godot check is skipped'; echo skip=true >> "$GITHUB_OUTPUT"; fi
          else
            brew install --cask godot
          fi
      - if: ${{ !cancelled() && steps.godot.outcome == 'success' && steps.godot.outputs.skip != 'true' }}
        run: node scripts/macos-check.mjs godot
      # the UI audit gates, as in ui-audit, on the current Studio and on /next/
      - id: devdeps
        if: ${{ !cancelled() }}
        run: npm ci --no-audit --no-fund && npx playwright install chromium-headless-shell
        working-directory: tools/dev
      - if: ${{ !cancelled() && steps.devdeps.outcome == 'success' }}
        run: npm run audit
        working-directory: tools/dev
      - if: ${{ !cancelled() && steps.devdeps.outcome == 'success' }}
        run: npm run audit
        working-directory: tools/dev
        env:
          AUDIT_APP: next
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-macos
          path: test-results
          retention-days: 7
      # what this job started and made, gone whichever way it ended (the self-hosted Mac keeps what a job leaves)
      - if: always()
        run: |
          if [ -n "$HERMES_HOME" ]; then pkill -f "$HERMES_HOME" || true; fi
          pkill -f "$RUNNER_TEMP/pw" || true
          rm -rf "$(cd "$RUNNER_TEMP/../.." && pwd)"/_cache/hermes-*
          rm -rf "$HERMES_HOME" "$RUNNER_TEMP/pw" "$RUNNER_TEMP/npm" "$RUNNER_TEMP/pip" "$RUNNER_TEMP/uv" "$RUNNER_TEMP/xdg" "$RUNNER_TEMP/venv" "$RUNNER_TEMP/hermes-install.sh" "$RUNNER_TEMP/plugins.txt" test-results
          rm -rf "${TMPDIR:-/tmp}"/swarm-walk-* "${TMPDIR:-/tmp}"/swarm-video-* "${TMPDIR:-/tmp}"/swarm-ff-* "${TMPDIR:-/tmp}"/swarm-images-*
          df -h "$RUNNER_TEMP" | tail -1
  # property tests (decision 0019): random sequences against the deterministic rules, 1000 cases each, with
  # fast-check (pinned, tools/dev only)
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix tools/dev --no-audit --no-fund
      - run: npm run --prefix tools/dev property
  # metamorphic relations (decision 0019 point 3, tests/metamorphic/README.md): what must hold between two builds
  # when no output is the one right answer, checked on the crew's recorded output; the nightly workflow
  # (metamorphic-nightly.yml) checks the same on live models
  metamorphic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "tests/metamorphic/*.test.mjs"
  # the next UI's stories build (ui/, its Storybook mock-ups); nothing of it is kept
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix ui --no-audit --no-fund
      - run: npm run --prefix ui build-storybook
  # the Studio shows the build that was clicked, in a real browser (scripts/open-check.mjs)
  open-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock playwright@1.64.1
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: node scripts/open-check.mjs
      # model-written pages cannot reach the studio (scripts/sandbox-check.mjs, catalog review point 4)
      - run: node scripts/sandbox-check.mjs
      # board videos: posters, teardown off screen, at most 2 playing, while a board of 10 clips is scrolled
      # (scripts/video-check.mjs, web/video.js)
      - run: node scripts/video-check.mjs
  # the UI audit gates (docs/ux/AUDIT.md, tools/dev/audit): every top-level screen at 1440 and 390 wide has
  # its breadcrumb, no axe violation, no sideways scroll, no console error and a loading state, apart from the
  # violations already in .ui-audit-known-violations.json
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
        working-directory: tools/dev
      - run: npx playwright install --with-deps chromium-headless-shell
        working-directory: tools/dev
      # the next UI's build, made here as on every branch: main and pull requests carry no ui/dist/, only a release
      # does (docs/decisions/0018-next-ui-build-on-release.md); SWARM_NEED_UI makes the checks fail without it
      - run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
      - run: npm run audit
        working-directory: tools/dev
      # the same gates on the next UI at /next/, against its own known list (docs/decisions/0013-react-ui-coexists.md)
      - if: success() || failure()
        run: npm run audit
        working-directory: tools/dev
        env:
          AUDIT_APP: next
      # what each screen found (test-results/audit-found) and Playwright's traces
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: test-results
          retention-days: 7
  # the OpenSpec scenarios run (decision 0019 point 2, tests/bdd/gen.mjs, tools/dev/bdd.config.mjs): each one has a
  # bound test or is marked pending #N in tests/bdd/pending.json, else bddgen fails here; they run in the current
  # Studio at / and, for a screen that has moved, in the next UI at /next/
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
        working-directory: tools/dev
      - run: npx playwright install --with-deps chromium-headless-shell
        working-directory: tools/dev
      # /next/ is served from ui/dist/, built here (main and pull requests carry none)
      - run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
      - run: npm run bdd
        working-directory: tools/dev
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bdd
          path: test-results/bdd
          retention-days: 7
  # The base a pull request is compared with is the main it is merged with for the run (the first parent of
  # the merge commit that is checked out), not `pull_request.base.sha`, which is main as it was when the pull
  # request was last pushed: with that, whatever landed on main since read as this pull request's change
  # (2026-11-13: a Studio layout change on main failed three later pull requests' motion checks).
  # the Studio moves the same before and after (docs/ux/MOTION.md, scripts/motion-check.mjs): the base
  # and the head are each recorded twice in this runner and compared; skipped when web/, server/ and the check itself are untouched
  motion-check:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: touched
        run: |
          base=$(git rev-parse -q --verify HEAD^2 >/dev/null && git rev-parse HEAD^1 || echo ${{ github.event.pull_request.base.sha }})
          if git diff --quiet "$base" HEAD -- web server scripts/motion-check.mjs scripts/walkthrough-fixtures.mjs; then echo "run=no" >> "$GITHUB_OUTPUT"; echo 'web/ and server/ are untouched'; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.touched.outputs.run == 'yes'
        run: npm install --no-save --no-package-lock playwright@1.64.1 && npx playwright install --with-deps chromium-headless-shell
      # a pull request that means to change how a scene looks says so in its description, on one line:
      # "Motion: looks change in studio, overview" (docs/ux/MOTION.md); the animations are still compared
      # (animations a change means to add or remove go in docs/ux/motion/accepted.json)
      - if: steps.touched.outputs.run == 'yes'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          looks=$(printf '%s\n' "$BODY" | tr -d '\r' | sed -n 's/^Motion: looks change in \([a-z, -]*\)$/\1/p' | head -1 | tr -d ' ')
          echo "looks change in: ${looks:-none}"
          base=$(git rev-parse -q --verify HEAD^2 >/dev/null && git rev-parse HEAD^1 || echo ${{ github.event.pull_request.base.sha }})
          git worktree add "$RUNNER_TEMP/base" "$base"
          m=$RUNNER_TEMP/motion
          node scripts/motion-check.mjs record $m/before1 --root "$RUNNER_TEMP/base"
          node scripts/motion-check.mjs record $m/after1
          node scripts/motion-check.mjs record $m/before2 --root "$RUNNER_TEMP/base"
          node scripts/motion-check.mjs record $m/after2
          node scripts/motion-check.mjs compare $m/before1,$m/before2 $m/after1,$m/after2 --looks "$looks"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: motion
          path: ${{ runner.temp }}/motion
          retention-days: 7
  # prompt evals (decision 0019 point 5, bench/evals/README.md): a change to a crew prompt is measured on the
  # crew's test sets before and after (the reviewer's score, slop-linter findings, build time, tokens) and fails
  # past bench/evals/thresholds.json. With the SWARM_EVAL_API_KEY secret CI measures both sides itself; without
  # it, the PR commits the report `node bench/evals/run.mjs gate --base origin/main` wrote, and CI checks it
  prompt-evals:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: touched
        run: |
          base=$(git rev-parse -q --verify HEAD^2 >/dev/null && git rev-parse HEAD^1 || echo ${{ github.event.pull_request.base.sha }})
          if git diff --quiet "$base" HEAD -- engine/prompts.mjs engine/review.mjs engine/pagetype.mjs engine/lint bench/evals; then echo "run=no" >> "$GITHUB_OUTPUT"; echo 'no crew prompt changed'; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.touched.outputs.run == 'yes'
        run: npm ci --prefix tools/dev --no-audit --no-fund && npx --prefix tools/dev playwright install --with-deps chromium-headless-shell
      - if: steps.touched.outputs.run == 'yes'
        env:
          SWARM_API_KEY: ${{ secrets.SWARM_EVAL_API_KEY }}
        run: |
          base=$(git rev-parse -q --verify HEAD^2 >/dev/null && git rev-parse HEAD^1 || echo ${{ github.event.pull_request.base.sha }})
          if [ -n "$SWARM_API_KEY" ]; then node bench/evals/run.mjs gate --base "$base"; else node bench/evals/run.mjs check --base "$base"; fi
      - if: steps.touched.outputs.run == 'yes' && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: prompt-evals
          path: bench/evals/reports
          retention-days: 30
  # a screen moved to the next UI (/next/, issue #404) moves as it does in the current Studio (/): the same
  # animations, durations and easings, the same cursor paths, and still with reduced motion
  # (docs/ux/MOTION.md, scripts/motion-parity.mjs). Both apps run from this pull request's tree; screens not
  # moved yet are skipped. The side-by-side videos (left /, right /next/) are uploaded on every run.
  motion-parity:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: touched
        run: |
          base=$(git rev-parse -q --verify HEAD^2 >/dev/null && git rev-parse HEAD^1 || echo ${{ github.event.pull_request.base.sha }})
          if git diff --quiet "$base" HEAD -- ui web server scripts/motion-check.mjs scripts/motion-parity.mjs scripts/walkthrough-fixtures.mjs; then echo "run=no" >> "$GITHUB_OUTPUT"; echo 'ui/, web/ and server/ are untouched'; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      # the next UI's build, made here as on every branch: main and pull requests carry no ui/dist/, only a release
      - if: steps.touched.outputs.run == 'yes'
        run: npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
      - if: steps.touched.outputs.run == 'yes'
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1 && npx playwright install --with-deps chromium-headless-shell
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - if: steps.touched.outputs.run == 'yes'
        run: node scripts/motion-parity.mjs run "$RUNNER_TEMP/parity"
      - if: steps.touched.outputs.run == 'yes' && (success() || failure())
        run: |
          node scripts/motion-parity.mjs clips "$RUNNER_TEMP/parity/clips"
          { echo '## Motion parity, / against /next/'; cat "$RUNNER_TEMP/parity/report.md" 2>/dev/null; echo; echo 'Side by side (left /, right /next/): the motion-parity artifact, clips/'; } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.touched.outputs.run == 'yes' && (success() || failure())
        uses: actions/upload-artifact@v4
        with:
          name: motion-parity
          path: |
            ${{ runner.temp }}/parity/report.md
            ${{ runner.temp }}/parity/clips/*.webm
            ${{ runner.temp }}/parity/*/trace.json
          retention-days: 30
  # how heavy a 250-page board is (scripts/board-gauge.mjs, image-first boards step 1): the base and the head are
  # each measured three times in this runner, interleaved, and compared; it fails on p95 frame time +10% (over
  # every run's frames, and at least 0.5 ms), JS heap, DOM nodes or GPU memory +15%, or more live frames,
  # crashes or players left after leaving the board, or a film that did not play.
  # Skipped when web/, ui/, server/ and the gauge itself are untouched
  board-gauge:
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: touched
        run: |
          base=${{ github.event.pull_request.base.sha }}
          if git diff --quiet "$base" HEAD -- web ui server scripts/board-gauge.mjs; then echo "run=no" >> "$GITHUB_OUTPUT"; echo 'web/, ui/ and server/ are untouched'; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.touched.outputs.run == 'yes'
        run: npm install --no-save --no-package-lock playwright@1.64.1 && npx playwright install --with-deps chromium-headless-shell
      # /next/ is served from ui/dist/, which main and pull requests do not carry: each side builds its own
      - if: steps.touched.outputs.run == 'yes'
        run: |
          git worktree add "$RUNNER_TEMP/base" ${{ github.event.pull_request.base.sha }}
          npm ci --prefix ui --no-audit --no-fund && npm run --prefix ui build
          npm ci --prefix "$RUNNER_TEMP/base/ui" --no-audit --no-fund && npm run --prefix "$RUNNER_TEMP/base/ui" build
      - if: steps.touched.outputs.run == 'yes'
        run: |
          g=$RUNNER_TEMP/gauge
          mkdir -p $g
          for i in 1 2 3; do
            node scripts/board-gauge.mjs measure $g/base$i.json --root "$RUNNER_TEMP/base" --runs 1
            node scripts/board-gauge.mjs measure $g/head$i.json --runs 1
          done
          node scripts/board-gauge.mjs compare $g/base1.json,$g/base2.json,$g/base3.json $g/head1.json,$g/head2.json,$g/head3.json
      # the numbers, pass or fail (docs/perf/board-gauge.json is a baseline read from them)
      - if: always() && steps.touched.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: board-gauge
          path: ${{ runner.temp }}/gauge
          retention-days: 14
