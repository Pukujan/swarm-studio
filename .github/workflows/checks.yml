name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: bash scripts/check.sh
      # the type check and the dependency rules (tools/dev: development only, never installed by the plugin)
      - run: npm ci --prefix tools/dev --no-audit --no-fund
      - run: npm run --prefix tools/dev typecheck
      - run: npm run --prefix tools/dev deps
      - run: npm run --prefix tools/dev tokens:check
      # the next UI (ui/, docs/decisions/0013-react-ui-coexists.md): its type check and dependency rules, and the
      # committed ui/dist/ is what its source builds (development only: the plugin installs none of it)
      - run: npm ci --prefix ui --no-audit --no-fund
      - run: npm run --prefix tools/dev typecheck:ui
      - run: npm run --prefix tools/dev deps:ui
      - run: npm run --prefix tools/dev ui:check
      # the vendored libraries are exactly what their npm tarballs build (scripts/vendor.mjs)
      - run: node scripts/vendor.mjs --check
  # the same checks on Windows, where the owner develops: git's autocrlf, Git Bash and Windows paths (issue #408)
  checks-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # setup-python names it python.exe only; check.sh calls python3
      - run: command -v python3 || cp "$(command -v python)" "$(dirname "$(command -v python)")/python3.exe"
      - run: python -m pip install --quiet pillow
      - run: bash scripts/check.sh
  # the next UI's stories build (ui/, its Storybook mock-ups); nothing of it is kept
  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --prefix ui --no-audit --no-fund
      - run: npm run --prefix ui build-storybook
  # the Studio shows the build that was clicked, in a real browser (scripts/open-check.mjs)
  open-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-package-lock playwright@1.64.1
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: node scripts/open-check.mjs
      # model-written pages cannot reach the studio (scripts/sandbox-check.mjs, catalog review point 4)
      - run: node scripts/sandbox-check.mjs
  # the UI audit gates (docs/ux/AUDIT.md, tools/dev/audit): every top-level screen at 1440 and 390 wide has
  # its breadcrumb, no axe violation, no sideways scroll, no console error and a loading state, apart from the
  # violations already in .ui-audit-known-violations.json
  ui-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
        working-directory: tools/dev
      - run: npx playwright install --with-deps chromium-headless-shell
        working-directory: tools/dev
      - run: npm run audit
        working-directory: tools/dev
      # what each screen found (test-results/audit-found) and Playwright's traces
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit
          path: test-results
          retention-days: 7
  # the Studio moves the same before and after (docs/ux/MOTION.md, scripts/motion-check.mjs): the base
  # and the head are each recorded twice in this runner and compared; skipped when web/, server/ and the check itself are untouched
  motion-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: touched
        run: |
          base=${{ github.event.pull_request.base.sha }}
          if git diff --quiet "$base" HEAD -- web server scripts/motion-check.mjs scripts/walkthrough-fixtures.mjs; then echo "run=no" >> "$GITHUB_OUTPUT"; echo 'web/ and server/ are untouched'; else echo "run=yes" >> "$GITHUB_OUTPUT"; fi
      - if: steps.touched.outputs.run == 'yes'
        run: npm install --no-save --no-package-lock playwright@1.64.1 && npx playwright install --with-deps chromium-headless-shell
      - if: steps.touched.outputs.run == 'yes'
        run: |
          git worktree add "$RUNNER_TEMP/base" ${{ github.event.pull_request.base.sha }}
          m=$RUNNER_TEMP/motion
          node scripts/motion-check.mjs record $m/before1 --root "$RUNNER_TEMP/base"
          node scripts/motion-check.mjs record $m/after1
          node scripts/motion-check.mjs record $m/before2 --root "$RUNNER_TEMP/base"
          node scripts/motion-check.mjs record $m/after2
          node scripts/motion-check.mjs compare $m/before1,$m/before2 $m/after1,$m/after2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: motion
          path: ${{ runner.temp }}/motion
          retention-days: 7
