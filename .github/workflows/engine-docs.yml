name: engine-docs
# A pull request that changes an engine's glue code updates that engine's page in docs/engines/ or names it in
# the PR description (scripts/engine-docs-check.mjs). Runs again when the description is edited.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
# a new push to a pull request stops the run of the push before it; a push to main is never stopped
concurrency:
  group: engine-docs-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  engine-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/engine-docs-check.mjs
      # against main as it is now (fetch-depth 0 has it): from the base commit the pull request was opened against, a
      # branch that merged main in would be charged with every glue change main gained since
      - run: node scripts/engine-docs-check.mjs --base origin/${{ github.event.pull_request.base.ref }}
