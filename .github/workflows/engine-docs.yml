name: engine-docs
# A pull request that changes an engine's glue code updates that engine's page in docs/engines/ or names it in
# the PR description (scripts/engine-docs-check.mjs). Runs again when the description is edited.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  engine-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/engine-docs-check.mjs
      - run: node scripts/engine-docs-check.mjs --base ${{ github.event.pull_request.base.sha }}
