<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<script>
// The frame grows to fit its page, so the page's own viewport (vh, innerHeight)
// would grow with it: a 100vh hero makes the frame taller, which makes the hero
// taller, for ever. Pin the viewport to a laptop screen, 1280×900, before any
// of the page's styles or scripts run.
;(() => {
  const VH = 900, VW = 1280
  try {
    Object.defineProperty(window, 'innerHeight', { get: () => VH, configurable: true })
    Object.defineProperty(window, 'outerHeight', { get: () => VH, configurable: true })
    Object.defineProperty(document.documentElement, 'clientHeight', { get: () => VH, configurable: true })
  } catch {}
  const unit = /(-?\d*\.?\d+)(s|d|l)?(vh|vmin|vmax)\b/g
  const val = text => text.replace(unit, (_, n, __, u) => `${+(Number(n) * (u === 'vmax' ? VW : VH) / 100).toFixed(2)}px`)
  // in a stylesheet only the declarations change, never a selector such as .h-\[50vh\]
  const px = css => css.replace(/\{([^{}]*)\}/g, (_, body) => `{${val(body)}}`)
  // rewrite only when something changes, so our own edit doesn't wake the observer again
  const fix = el => {
    if (el.tagName === 'STYLE') { const t = el.textContent, n = px(t); if (n !== t) el.textContent = n }
    const st = el.getAttribute?.('style')
    if (st) { const n = val(st); if (n !== st) el.setAttribute('style', n) }
  }
  const sweep = root => { fix(root); root.querySelectorAll?.('style, [style]').forEach(fix) }
  window.__swarmVh = { px, val, sweep }
  new MutationObserver(list => {
    for (const m of list) {
      if (m.type === 'attributes') fix(m.target)
      else if (m.type === 'characterData') { const p = m.target.parentElement; if (p?.tagName === 'STYLE') fix(p) }
      else for (const n of m.addedNodes) if (n.nodeType === 1) sweep(n); else if (n.parentElement?.tagName === 'STYLE') fix(n.parentElement)
    }
  }).observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['style'] })
})()
</script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
  :root { --font-heading: Georgia, serif; --font-body: system-ui, sans-serif; --radius: 12px;
          --background: #fafafa; --foreground: #111; --primary: #222; --primary-foreground: #fff;
          --muted: #eee; --muted-foreground: #666; --border: #ddd; --accent: #c60; --card: #fff; }
  html, body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font-body); }
  body { min-height: 400px; overflow: hidden; }
  [data-slot] { position: relative; }
  [data-slot].wire, [data-slot].streaming { min-height: var(--h); }
  [data-slot].wire { outline: 2px dashed color-mix(in srgb, var(--agent, #8892a0) 85%, transparent); outline-offset: -8px;
    background: repeating-linear-gradient(135deg, transparent 0 14px, color-mix(in srgb, var(--agent, #8892a0) 8%, transparent) 14px 15px); }
  [data-slot].wire::before { content: attr(data-label); position: absolute; left: 20px; top: 20px; font: 600 15px/1 ui-monospace, monospace;
    letter-spacing: .05em; text-transform: uppercase; color: color-mix(in srgb, var(--agent, #8892a0) 90%, black); }
  [data-slot].planned { opacity: .55; }
  [data-slot].drawing { animation: draw .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes draw { from { clip-path: inset(0 100% 100% 0); } to { clip-path: inset(0 0 0 0); } }
  [data-slot].streaming { outline: 3px solid color-mix(in srgb, var(--agent) 75%, transparent); outline-offset: -3px; }
  [data-slot].flash { animation: flash 1.1s ease-out; }
  @keyframes flash { from { box-shadow: inset 0 0 0 6px var(--agent); } to { box-shadow: inset 0 0 0 0 transparent; } }
  [data-slot].failed { outline: 3px dashed #e5484d; outline-offset: -8px; }
  .swarm-caret { position: absolute; left: 0; top: 0; width: 3px; z-index: 50; pointer-events: none; border-radius: 2px; box-shadow: 0 0 10px currentColor; animation: caret 1s steps(2) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  /* an image being painted: a soft shimmer until its src arrives */
  img[data-gen]:not([src]) { color: transparent; background: linear-gradient(100deg, color-mix(in srgb, var(--muted) 80%, transparent) 30%, color-mix(in srgb, var(--card) 90%, transparent) 50%, color-mix(in srgb, var(--muted) 80%, transparent) 70%) 0 0 / 300% 100%; animation: paint 1.6s linear infinite; min-height: 120px; }
  img[data-gen][data-failed] { animation: none; background: var(--muted); }
  /* a sketch stands in for the photo; the real one fades in over it */
  img[data-gen]:not([data-sketch]) { animation: develop .9s ease-out; }
  @keyframes develop { from { filter: blur(14px) saturate(.3); opacity: .4; } to { filter: none; opacity: 1; } }
  @keyframes paint { from { background-position: 100% 0; } to { background-position: -50% 0; } }
  /* the reviewer looking at the page */
  #scan { position: absolute; inset: 0; pointer-events: none; z-index: 99; overflow: hidden; }
  #scan::before { content: ''; position: absolute; left: 0; right: 0; height: 240px; top: -240px; background: linear-gradient(180deg, transparent, #7c9cff38 85%, #7c9cffcc); animation: scan 2.4s cubic-bezier(.45,0,.55,1) infinite; }
  #scan::after { content: attr(data-t); position: absolute; right: 18px; top: 18px; font: 700 15px/1 ui-monospace, monospace; color: #fff; background: #4a5fd0; padding: 8px 12px; border-radius: 99px; }
  @keyframes scan { to { top: 100%; } }
</style>
<script>
// A page frame. The canvas can't reach into it (inside the Desktop pane every
// frame has its own opaque origin), so it is driven by messages: the canvas
// sends theme and slot updates, the frame reports its geometry back.
;(() => {
  const slots = new Map()
  let last = ''

  function place(el, key, where) {
    const footer = slots.get('*/footer')
    if (where === 'start') document.body.prepend(el)
    else if (where === 'end' || !footer) document.body.append(el)
    else document.body.insertBefore(el, footer)
    slots.set(key, el)
  }

  function theme(t) {
    const root = document.documentElement
    for (const [k, v] of Object.entries(t.vars || {})) root.style.setProperty(k, v)
    const heading = t.fonts?.heading || 'Georgia', body = t.fonts?.body || 'Inter'
    root.style.setProperty('--font-heading', `'${heading}', Georgia, serif`)
    root.style.setProperty('--font-body', `'${body}', system-ui, sans-serif`)
    if (t.radius) root.style.setProperty('--radius', t.radius)
    let link = document.getElementById('fonts')
    if (!link) {
      link = document.createElement('link')
      link.id = 'fonts'
      link.rel = 'stylesheet'
      document.head.append(link)
    }
    const fam = n => `family=${encodeURIComponent(n).replace(/%20/g, '+')}:wght@400;500;600;700`
    const href = `https://fonts.googleapis.com/css2?${fam(heading)}&${fam(body)}&display=swap`
    if (link.href !== href) link.href = href
  }

  function slot(m) {
    let el = slots.get(m.key)
    if (!el) {
      el = document.createElement('div')
      el.dataset.slot = m.key
      place(el, m.key, m.where)
    }
    if (m.cls !== undefined) el.className = m.cls
    if (m.label !== undefined) el.dataset.label = m.label
    if (m.h) el.style.setProperty('--h', `${m.h}px`)
    if (m.color) el.style.setProperty('--agent', m.color)
    if (m.anim) {
      el.classList.add(m.anim)
      setTimeout(() => el.classList.remove(m.anim), m.anim === 'flash' ? 1100 : 650)
    }
    if (m.html !== undefined) el.innerHTML = m.html
    if (m.hidden !== undefined) el.style.display = m.hidden ? 'none' : ''
  }

  // The end of the last visible text in a node: where a writing cursor sits.
  function lastText(node) {
    for (let n = node.lastChild; n; n = n.previousSibling) {
      if (n.nodeType === 3 && n.textContent.trim()) {
        const r = document.createRange()
        r.selectNodeContents(n)
        const rects = r.getClientRects()
        if (rects.length) return rects[rects.length - 1]
      } else if (n.nodeType === 1) {
        const r = lastText(n)
        if (r) return r
        const b = n.getBoundingClientRect()
        if (b.width && b.height) return b
      }
    }
    return null
  }

  const round = r => [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]

  // a caret in the agent's colour where the text is being written
  const carets = new Map()
  function caret(key, el, t) {
    let c = carets.get(key)
    if (!el.classList.contains('streaming') || !t) { if (c) { c.remove(); carets.delete(key) } return }
    if (!c) { c = document.createElement('i'); c.className = 'swarm-caret'; document.body.append(c); carets.set(key, c) }
    c.style.background = getComputedStyle(el).getPropertyValue('--agent') || '#7c9cff'
    c.style.transform = `translate(${Math.round(t.right + scrollX)}px, ${Math.round(t.top + scrollY)}px)`
    c.style.height = `${Math.max(14, Math.round(t.height))}px`
  }

  function report() {
    const geo = { type: 'geo', height: document.body.scrollHeight, slots: {}, gotos: [] }
    for (const [key, el] of slots) {
      const r = el.getBoundingClientRect()
      const t = lastText(el)
      geo.slots[key] = { box: round(r), last: t ? [Math.round(Math.min(t.right, r.right - 10)), Math.round(t.bottom)] : null }
      caret(key, el, t)
      for (const g of el.querySelectorAll('[data-goto]')) {
        geo.gotos.push({ key, target: g.dataset.goto, box: round(g.getBoundingClientRect()) })
      }
    }
    const text = JSON.stringify(geo)
    if (text === last) return false
    last = text
    parent.postMessage(geo, '*')
    return true
  }

  function fontEmbedCSS() {
    // html-to-image can't read a stylesheet from another origin (Google Fonts), so a
    // snapshot fell back to system fonts and a resting page seemed to change font.
    // Fetch the faces ourselves (latin only, each file once) and hand them over inlined.
    const href = document.querySelector('link[href*="fonts.googleapis.com"]')?.href || ''
    if (!href) return Promise.resolve('')
    if (fontEmbedCSS.href !== href) {
      fontEmbedCSS.href = href
      const files = new Map()
      const inline = u => files.get(u) || files.set(u, fetch(u).then(r => r.blob()).then(b => new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(b) }))).get(u)
      fontEmbedCSS.css = fetch(href).then(r => r.text()).then(async css => {
        const blocks = css.split(/(?=\/\* [\w-]+ \*\/)/).filter(b => !/^\/\* /.test(b) || /^\/\* latin(-ext)? \*\//.test(b))
        const out = await Promise.all(blocks.map(async b => {
          for (const u of new Set([...b.matchAll(/url\((https:[^)]+)\)/g)].map(m => m[1]))) b = b.split(u).join(await inline(u))
          return b
        }))
        return out.join('\n')
      }).catch(() => '')
    }
    return fontEmbedCSS.css
  }

  // A screenshot of the page for the visual reviewer, scaled to at most 800 x 3000.
  let lib = null
  function snap(m) {
    lib ||= new Promise((ok, fail) => {
      const s = document.createElement('script')
      s.src = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js'
      s.onload = () => ok(window.htmlToImage)
      s.onerror = () => { lib = null; fail(new Error('could not load the screenshot library')) }
      document.head.append(s)
    })
    // a half-written tag leaves attributes no XML parser takes, and the whole photo fails
    for (const el of document.body.querySelectorAll('*')) for (const at of [...el.attributes]) if (!/^[A-Za-z_:][\w.:-]*$/.test(at.name)) el.removeAttribute(at.name)
    const h = document.body.scrollHeight, r = Math.min(m.scale || 0.625, (m.scale ? 5000 : 3000) / h)
    const bg = getComputedStyle(document.body).backgroundColor
    const opts = { width: 1280, height: h, pixelRatio: r, quality: 0.72, backgroundColor: bg, filter: n => n.id !== 'scan' }
    Promise.all([lib, fontEmbedCSS(), document.fonts?.ready])
      .then(([h2i, css]) => h2i.toJpeg(document.body, css ? { ...opts, fontEmbedCSS: css } : opts).catch(() => h2i.toJpeg(document.body, { ...opts, skipFonts: true })))
      .then(image => parent.postMessage({ type: 'snap', seq: m.seq, ok: true, image, r }, '*'))
      .catch(err => parent.postMessage({ type: 'snap', seq: m.seq, ok: false, error: String(err.message || err) }, '*'))
  }

  function scan(on) {
    let el = document.getElementById('scan')
    if (on && !el) {
      el = document.createElement('div')
      el.id = 'scan'
      document.body.append(el)
      // the pill counts the seconds: a vision model can take a while
      const from = Date.now(), tick = () => { el.dataset.t = `🔎 reviewing · ${Math.round((Date.now() - from) / 1000)}s` }
      tick()
      el.timer = setInterval(tick, 1000)
    }
    if (!on && el) { clearInterval(el.timer); el.remove() }
  }

  addEventListener('message', e => {
    if (e.source !== parent) return
    const m = e.data || {}
    if (m.type === 'theme') theme(m.theme)
    else if (m.type === 'slot') slot(m)
    else if (m.type === 'snap') snap(m)
    else if (m.type === 'scan') scan(m.on)
  })
  addEventListener('DOMContentLoaded', () => {
    parent.postMessage({ type: 'ready' }, '*')
    // every 80ms while the page changes; once it has been still for 2s, every 0.5s
    let still = 0
    setInterval(() => {
      if (still > 25 && still++ % 6) return
      still = report() ? 0 : still + 1
    }, 80)
  })
})()
</script>
</head>
<body></body>
</html>
