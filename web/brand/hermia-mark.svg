<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Commander Hermia</title>
  <!-- Swarm Studio's mark: Commander Hermia's helmeted face in a circle.
       Three colours only: violet, off-white, pink. Original art. -->
  <circle cx="32" cy="32" r="32" fill="#8b3dff"/>
  <!-- the helmet's wings -->
  <path d="M17 27C10 25 5.5 19 5 11C9.5 14.5 14 15.5 19 16C15.5 18.5 15 22.5 17 27Z" fill="#F2F2F2"/>
  <path d="M47 27C54 25 58.5 19 59 11C54.5 14.5 50 15.5 45 16C48.5 18.5 49 22.5 47 27Z" fill="#F2F2F2"/>
  <path d="M7.5 15.5L14 20.5M10.5 21L15.5 23.5M56.5 15.5L50 20.5M53.5 21L48.5 23.5" stroke="#8b3dff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="32" cy="36.5" r="15.5" fill="#F2F2F2"/>
  <!-- helmet dome and its pink band -->
  <path d="M15.6 30C15.6 18.6 23 12 32 12S48.4 18.6 48.4 30Z" fill="#F2F2F2"/>
  <path d="M15.4 27.4Q32 23.6 48.6 27.4L48.8 31.6Q32 27.8 15.2 31.6Z" fill="#ff4fd8"/>
  <path d="M32 13.2V24.4" stroke="#8b3dff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- fringe -->
  <path d="M15.4 31.4Q32 27.6 48.6 31.4C48 34.4 45.6 35.6 43.4 33.6C41.6 36.4 38.4 36 37 33.2C35.2 36 28.8 36 27 33.2C25.6 36 22.4 36.4 20.6 33.6C18.4 35.6 16 34.4 15.4 31.4Z" fill="#8b3dff"/>
  <!-- eyes and smile -->
  <ellipse cx="25.6" cy="40" rx="2.9" ry="3.7" fill="#8b3dff"/>
  <ellipse cx="38.4" cy="40" rx="2.9" ry="3.7" fill="#8b3dff"/>
  <circle cx="24.7" cy="38.7" r="1" fill="#F2F2F2"/>
  <circle cx="37.5" cy="38.7" r="1" fill="#F2F2F2"/>
  <path d="M29 46.4Q32 48.8 35 46.4" fill="none" stroke="#8b3dff" stroke-width="1.8" stroke-linecap="round"/>
  <!-- the cape's collar, with its pink trim -->
  <path d="M17 58.5Q32 50 47 58.5" fill="none" stroke="#ff4fd8" stroke-width="3" stroke-linecap="round"/>
</svg>
