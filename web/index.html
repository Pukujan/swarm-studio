<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm Studio</title>
<link rel="icon" type="image/svg+xml" href="brand/hermia-mark.svg">
<script>try { const t = localStorage.getItem('swarm-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch {}</script>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="canvas.css">
<link rel="stylesheet" href="studio.css">
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="project.css">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="setup.css">
<link rel="stylesheet" href="plan.css">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="scaffold.css">
<link rel="stylesheet" href="workshop.css">
<link rel="stylesheet" href="pet.css">
<script src="crew.js"></script>
<script src="chatter.js"></script>
<script src="show.js"></script>
<script src="ui.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo" src="brand/hermia-mark.svg" alt="" width="28" height="28"><span class="word">Swarm <em>Studio</em></span></div>
    <div class="file-name" id="file-name">Untitled</div>
    <nav class="seg views" id="views" aria-label="Views">
      <button data-view="canvas" class="on" data-sys="canvas"><span>Canvas</span></button>
      <button data-view="video" data-sys="video"><span>Video</span><i class="vbadge"></i></button>
      <button data-view="app" data-sys="app"><span>App</span><i class="vbadge"></i></button>
    </nav>
    <button class="toggle game-btn" id="game-btn" aria-label="Game"><i data-i="gamepad-2"></i><span class="t">Game</span></button>
    <div class="spacer"></div>
    <button class="toggle crew-mute" id="crew-mute" data-mode="muted" aria-haspopup="dialog" aria-expanded="false" aria-label="Crew sound: muted"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5z"/><g class="cm-on"><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 18.4a9 9 0 0 0 0-12.8"/></g><path class="cm-off" d="m22 9-6 6M16 9l6 6"/></svg><svg class="ico cm-quiet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12.5a7.5 6 0 0 1-10.7 5.4L4 19.5l1.4-3.6A6 6 0 0 1 4.5 12.5 7.8 6 0 0 1 12.3 6.5"/><path d="M3 3l18 18"/></svg><span class="t">Muted</span></button>
    <div class="undo-redo"><button class="toggle" id="undo-btn" aria-label="Undo" disabled><i data-i="undo-2"></i></button><button class="toggle" id="redo-btn" aria-label="Redo" disabled><i data-i="redo-2"></i></button></div>
    <div class="more playwrap">
      <button class="toggle play" id="play-btn" aria-label="Play" disabled><i data-i="play"></i><span class="t">Play</span></button>
      <button class="toggle play play-caret" id="play-more" aria-label="Play options" aria-haspopup="menu" aria-expanded="false" disabled><i data-i="chevron-down"></i></button>
      <div class="more-menu play-menu" id="play-menu" role="menu" hidden>
        <button class="toggle" role="menuitem" data-play="prototype"><i data-i="play"></i>Play prototype</button>
        <button class="toggle" role="menuitem" data-play="visitor"><i data-i="eye"></i>Watch a visitor</button>
      </div>
    </div>
    <div class="more pubwrap">
      <button class="toggle" id="publish-btn" aria-label="Publish" aria-haspopup="true" disabled><i data-i="rocket"></i><span class="t">Publish</span><i data-i="chevron-down" class="caret"></i></button>
      <div class="more-menu pub-menu" id="pub-menu" hidden>
        <div class="menu-title">Put it <em>online</em></div>
        <div class="pub-live" hidden><a href="#" target="_blank" rel="noopener"></a><button class="pub-copy">Copy</button></div>
        <button class="pub-opt" data-pub="site"><b><i data-i="globe"></i>Website</b><small>Pages only</small></button>
        <button class="pub-opt" data-pub="app"><b><i data-i="server"></i>Working app</b><small>With its server</small><em class="pub-why"></em></button>
        <button class="pub-opt" data-pub="feed"><b><i data-i="send"></i>Swarm Feed</b><small>Share it</small></button>
      </div>
    </div>
    <div class="more">
      <button class="toggle" id="more-btn" aria-label="More" aria-haspopup="true"><i data-i="menu"></i><span class="t">More</span> <span id="agent-count" class="count">0</span></button>
      <div class="more-menu" id="more-menu" hidden>
        <button class="toggle" id="review-btn" disabled><i data-i="search-check"></i>Review</button>
        <button class="toggle" id="video-btn" disabled><i data-i="clapperboard"></i>Video</button>
        <button class="toggle" id="export-btn" disabled><i data-i="download"></i>Export</button>
        <button class="toggle" id="replay-btn" disabled><i data-i="rotate-ccw"></i>Replay</button>
        <button class="toggle" id="models-btn"><i data-i="sliders-horizontal"></i>Models</button>
        <button class="toggle" data-panel="design"><i data-i="palette"></i>Design</button>
        <button class="toggle" data-panel="planner"><i data-i="map"></i>Planner</button>
        <button class="toggle" data-panel="agents"><i data-i="users"></i>Agents</button>
        <button class="toggle" id="breakroom-btn"><i data-i="coffee"></i>Break room</button>
        <button class="toggle" id="theme-btn"><i data-i="sun"></i>Light</button>
      </div>
    </div>
    <div class="clock"><span id="timer">00.0s</span></div>
  </header>

  <aside class="side">
    <nav class="tabs">
      <button data-tab="chat" class="on"><i data-i="message-circle"></i>Chat</button>
      <button data-tab="log"><i data-i="scroll-text"></i>Log</button>
      <button type="button" class="chats-btn" id="chats-btn" aria-haspopup="dialog">Chats<i data-i="chevron-down"></i></button>
      <button class="side-min-btn" id="side-min" aria-label="Shrink the side panel"><i data-i="panel-left-close"></i></button>
    </nav>

    <section class="tab chat on" data-tab="chat">
      <div id="feed" class="feed"></div>
      <form id="brief-form" class="composer">
        <textarea id="brief" rows="3" autocomplete="off" placeholder="Describe a product"></textarea>
        <div class="row">
          <select id="agents" class="chip" aria-label="Agents">
            <option value="4">4 agents</option><option value="5">5 agents</option><option value="6">6 agents</option><option value="8" selected>8 agents</option><option value="12">12 agents</option><option value="16">16 agents</option><option value="20">20 agents</option><option value="24">24 agents</option>
          </select>
          <select id="build-model" class="chip model" aria-label="Build model"><option value="">Hermes default</option></select>
          <button type="submit">Build</button>
        </div>
      </form>
    </section>

    <section class="tab log" data-tab="log">
      <div id="log" class="feed"></div>
    </section>

  </aside>

  <!-- the Design deck's left panel: Layers, the page and section tree (web/layers.js); the Overview borrows the
       same tree for its Layers tab. In a narrow pane it is a sheet from the Layers button on the canvas -->
  <aside class="pj-side deck-layers" aria-label="Layers">
    <div class="pj-tabs" role="tablist"><span class="pj-tab on" role="tab" aria-selected="true">Layers</span></div>
    <div class="pj-layers"><div id="tree" class="tree"></div></div>
  </aside>

  <main id="viewport" class="viewport">
    <div id="world" class="world"></div>
    <svg id="wires" class="wires"></svg>
    <div class="dock" id="dock"><span class="dock-title"><i data-i="coffee"></i>break room</span><button class="dock-hide" id="dock-hide" aria-label="Hide the break room"><i data-i="x"></i></button></div>
    <div id="cursors" class="cursors"></div>
    <div class="toolbar" id="toolbar"></div>
    <div class="status" id="status">Ready</div>
    <button type="button" class="camera-hint auto" id="camera-hint" aria-label="Follow the crew" aria-pressed="true"><i data-i="users"></i>Follow</button>
    <button type="button" class="ib deck-layers-btn" aria-label="Layers" aria-expanded="false"><i data-i="layers"></i></button>

    <div class="float planner" data-panel="planner">
      <h3>Planner <span id="plan-state" class="pill">idle</span></h3>
      <div id="theme" class="theme"></div>
      <pre id="plan-stream" class="stream"></pre>
    </div>
    <div class="float agents-card" data-panel="agents">
      <h3>Agents</h3>
      <div id="agents-list" class="agents"></div>
    </div>
  </main>

  <section class="appview" id="appview" hidden>
    <div class="app-bar">
      <button class="toggle" id="app-steps-btn" aria-label="Hide the steps" aria-pressed="false"><i data-i="panel-left-close"></i></button>
      <span class="app-state pill" id="app-state">no app yet</span>
      <span class="app-stage" id="app-stage"></span>
      <button class="toggle" id="app-link" hidden></button>
      <div class="spacer"></div>
      <div class="seg" id="app-mode"><button data-mode="preview" class="on">Preview</button><button data-mode="code">Code</button></div>
      <div class="seg" id="app-device"><button data-w="390">Phone</button><button data-w="820">Tablet</button><button data-w="0" class="on">Desktop</button></div>
      <button class="toggle" id="app-reload" aria-label="Reload the app"><i data-i="rotate-cw"></i></button>
      <a class="toggle" id="app-port" target="_blank" rel="noopener" hidden></a><a class="toggle" id="app-open" target="_blank" rel="noopener" aria-label="Open the app in its own tab"><i data-i="external-link"></i></a>
      <button class="toggle" id="app-stop" hidden><i data-i="square"></i>Stop</button>
    </div>
    <div class="app-body">
      <div class="app-side">
        <div class="app-steps" id="app-steps"></div>
        <section class="app-hermia" id="app-hermia" hidden></section>
      </div>
      <div class="app-main">
        <div class="app-stagearea" id="app-preview"><div class="app-shell" id="app-shell"><iframe id="app-frame" aria-label="The app" sandbox="allow-scripts allow-forms"></iframe><div class="app-loading" id="app-loading" hidden role="status" aria-busy="true"><div class="spin"></div><span></span></div></div><div class="app-empty" id="app-empty"></div></div>
        <div class="app-code" id="app-code" hidden><div class="app-tree" id="app-tree"></div><pre class="app-file" id="app-file"></pre></div>
      </div>
    </div>
  </section>

  <aside class="design" data-panel="design">
    <nav class="dtabs">
      <button data-dtab="design" class="on">Design</button>
      <button data-dtab="vars">Variables</button>
      <button class="dclose" id="design-close" aria-label="Close"><i data-i="x"></i></button>
    </nav>
    <section class="dtab on" data-dtab="design" id="d-design"></section>
    <section class="dtab" data-dtab="vars" id="d-vars"></section>
  </aside>

  <div class="player" id="player" hidden>
    <div class="player-bar">
      <button class="pl-btn" id="pl-close" aria-label="Close"><i data-i="x"></i></button>
      <select id="pl-page" aria-label="Page"></select>
      <button class="pl-btn icon" id="pl-back" aria-label="Back"><i data-i="arrow-left"></i></button>
      <button class="pl-btn icon" id="pl-restart" aria-label="Restart"><i data-i="rotate-ccw"></i></button>
      <div class="tour-pick">
        <button class="pl-btn tours" id="pl-tours" aria-label="Watch a visitor"><span class="tw-ico"><i data-i="eye"></i><i data-i="square-stop" class="tw-stop"></i><span class="tw-spin" aria-hidden="true"></span></span><span class="t">Watch a visitor</span></button>
        <button class="pl-btn icon" id="pl-tour-list" aria-label="Visitors" aria-haspopup="menu" aria-expanded="false"><i data-i="chevron-down"></i></button>
        <div class="tour-menu" id="pl-tour-menu" hidden></div>
      </div>
      <div class="spacer"></div>
      <button class="pl-btn icon" id="pl-motion" aria-label="Motion"><i data-i="sparkles"></i></button>
      <div class="seg" id="pl-device">
        <button data-device="desktop" class="on">Desktop</button>
        <button data-device="mobile">Mobile</button>
      </div>
    </div>
    <div class="player-stage" id="pl-stage">
      <div class="device" id="pl-shell"><iframe id="pl-frame" aria-label="Prototype" sandbox="allow-scripts"></iframe></div>
      <div class="persona" id="pl-persona" hidden></div>
    </div>
    <div class="tour-cursor" id="pl-cursor" hidden><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 2l15 9.5-6.6 1.2 3.9 7.6-3 1.5-3.9-7.7L4 18.6z" fill="#F2F2F2" stroke="#05051a" stroke-width="1.5" stroke-linejoin="round"/></svg><div class="think" id="pl-think"></div></div>
  </div>

  <script type="module" src="canvas.js"></script>
  <script type="module" src="studio.js"></script>
</body>
</html>
