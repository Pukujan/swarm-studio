<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm Studio</title>
<link rel="stylesheet" href="canvas.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">◆</span> Swarm Studio</div>
    <form id="brief-form" class="brief">
      <input id="brief" autocomplete="off" placeholder="Describe a product — the swarm designs and builds its site"
        value="Driftwood — a booking app for surf schools: lessons, board rentals, instructor schedules, tide-aware session times.">
      <select id="agents" title="Agents">
        <option>8</option><option>12</option><option selected>16</option><option>20</option><option>24</option>
      </select>
      <button type="submit">Build</button>
    </form>
    <div class="clock"><span id="timer">00.0s</span></div>
  </header>

  <aside class="panel left">
    <section>
      <h3>Planner <span id="plan-state" class="pill">idle</span></h3>
      <div id="theme" class="theme"></div>
      <pre id="plan-stream" class="stream"></pre>
    </section>
    <section class="grow">
      <h3>Layers</h3>
      <div id="tree" class="tree"></div>
    </section>
  </aside>

  <main id="viewport" class="viewport">
    <div id="world" class="world"></div>
    <svg id="wires" class="wires"></svg>
    <div id="cursors" class="cursors"></div>
    <div class="toolbar" id="toolbar"></div>
    <div class="status" id="status">Ready</div>
    <div class="camera-hint" id="camera-hint">camera: auto</div>
  </main>

  <aside class="panel right">
    <section>
      <h3>Agents <span id="agent-count" class="pill">0</span></h3>
      <div id="agents-list" class="agents"></div>
    </section>
    <section class="grow">
      <h3>Feed</h3>
      <div id="feed" class="feed"></div>
    </section>
  </aside>

  <script type="module" src="canvas.js"></script>
</body>
</html>
