<style>
.search { flex: 1; max-width: 560px; height: 40px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--edge); display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--muted); font: 14px var(--mono) }
.chips { display: flex; gap: 8px; padding: 14px 20px 6px; overflow: hidden; flex: none }
.chips .chip { height: 32px; padding: 0 14px; font-size: 16px }
.grid { columns: 4; column-gap: 12px; padding: 10px 20px 0 }
.grid img { width: 100%; display: block; border-radius: 14px; margin-bottom: 12px; break-inside: avoid; object-fit: cover }
.grid .t { aspect-ratio: 3 / 4 } .grid .s { aspect-ratio: 1 }
@media (max-width: 600px) {
  .chips { padding: 12px 14px 4px }
  .grid { columns: 2; column-gap: 8px; padding: 8px 14px 0 }
  .grid img { margin-bottom: 8px; border-radius: 12px }
}
