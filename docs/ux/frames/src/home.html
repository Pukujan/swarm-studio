<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swarm · Home</title><link rel="stylesheet" href="kit.css">
<style>
.post, .post img { position: absolute; inset: 0; width: 100%; height: 100% }
.post img { object-fit: cover }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgb(5 5 26 / .55), transparent 22%, transparent 52%, rgb(5 5 26 / .92) 96%) }
.peek { position: absolute; left: 0; right: 0; bottom: 0; height: 28px; overflow: hidden; border-top: 2px solid var(--void) }
.peek img { width: 100%; height: 200px; object-fit: cover; object-position: top; filter: brightness(.7) }
.tabs { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 26px; font: 600 19px var(--label); letter-spacing: .04em; color: rgb(242 242 242 / .62); z-index: 2 }
.tabs span.on { color: var(--text); box-shadow: inset 0 -3px 0 var(--text); padding-bottom: 6px }
.meta { position: absolute; left: 40px; bottom: 64px; z-index: 2; max-width: 60% }
.maker { font: 600 18px var(--label); letter-spacing: .04em }
.meta h1 { font: 800 72px/0.92 var(--display); letter-spacing: .01em; margin: 6px 0 16px; text-shadow: 0 4px 30px rgb(0 0 0 / .5) }
.assets { display: flex; gap: 8px }
.assets img { width: 68px; height: 44px; object-fit: cover; border-radius: 8px; border: 1px solid rgb(242 242 242 / .3) }
.rail { position: absolute; right: 28px; bottom: 64px; display: flex; flex-direction: column; align-items: center; gap: 20px; z-index: 2 }
.who { position: relative; width: 52px; height: 52px; margin-bottom: 8px }
.who img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; border: 2px solid var(--text) }
.who b { position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--ink); display: grid; place-items: center }
.who b .ic { width: 14px; height: 14px; stroke-width: 3 }
.act { display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 15px var(--label); letter-spacing: .04em }
.act span.o { width: 48px; height: 48px; border-radius: 50%; background: rgb(5 5 26 / .45); display: grid; place-items: center; backdrop-filter: blur(6px) }
.act .ic { width: 26px; height: 26px }
.act.liked .ic { fill: var(--hot); stroke: var(--hot) }
.remix { height: 40px; padding: 0 16px; border-radius: 999px; background: var(--accent); color: var(--ink); display: flex; align-items: center; gap: 7px; font: 600 17px var(--label); letter-spacing: .04em }
.remix .ic { width: 18px; height: 18px }
@media (max-width: 600px) {
  .tabs { top: 14px; gap: 18px; font-size: 17px }
  .meta { left: 16px; bottom: 44px; max-width: 72% }
  .meta h1 { font-size: 46px; margin: 4px 0 12px }
  .assets img { width: 52px; height: 34px }
  .rail { right: 12px; bottom: 44px; gap: 14px }
  .who, .who img { width: 44px; height: 44px }
  .act span.o { width: 42px; height: 42px }
  .act .ic { width: 23px; height: 23px }
  .remix { width: 44px; padding: 0; justify-content: center; font-size: 0; gap: 0 }
}
</style></head>
<body data-nav="home"><div class="app"><nav class="nav"></nav><main class="main"><div class="stage">
  <div class="post"><img src="img/lantern-1.jpg" alt=""><div class="shade"></div></div>
  <div class="peek"><img src="img/neon-2.jpg" alt=""></div>
  <div class="tabs"><span class="on">For you</span><span>Following</span><span>Live</span></div>
  <div class="meta">
    <div class="maker">@mina.k</div>
    <h1>LANTERN DRIFT</h1>
    <div class="assets"><img src="img/lantern-stage.jpg" alt=""><img src="img/lantern-walk.jpg" alt=""><img src="img/lantern-friends.jpg" alt=""><img src="img/lantern-site.jpg" alt=""></div>
  </div>
  <div class="rail">
    <div class="who"><img src="img/lantern-friends.jpg" alt=""><b><i data-i="plus"></i></b></div>
    <div class="act liked"><span class="o"><i data-i="heart"></i></span>2.4k</div>
    <div class="act"><span class="o"><i data-i="message-circle"></i></span>318</div>
    <div class="act"><span class="o"><i data-i="bookmark"></i></span>506</div>
    <div class="act"><span class="o"><i data-i="send"></i></span>96</div>
    <div class="remix"><i data-i="repeat-2"></i>Remix</div>
  </div>
</div></main></div>
<script src="../../../../web/crew.js"></script><script src="frame.js"></script><script src="icons.js"></script></body></html>
