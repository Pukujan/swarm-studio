.pl.hot .lab { position: absolute; left: 50%; top: calc(100% + 14px); transform: translateX(-50%); white-space: nowrap; font: 600 17px var(--label); letter-spacing: .04em;

.pl.hot .lab em { font-style: normal; color: var(--muted); font-weight: 500 }
