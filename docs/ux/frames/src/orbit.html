<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swarm · Lantern Drift</title><link rel="stylesheet" href="kit.css">
<style>
.sys { position: absolute; left: 50%; top: 46%; width: 760px; height: 430px; transform: translate(-50%, -50%) }
.sys svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible }
.sun { position: absolute; left: 50%; top: 50%; width: 200px; height: 200px; transform: translate(-50%, -50%) }
.sun img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; box-shadow: 0 0 60px rgb(242 242 0 / .25), 0 0 120px rgb(0 0 242 / .5) }
.sun svg { position: absolute; inset: -16px; width: calc(100% + 32px); height: calc(100% + 32px); transform: rotate(-90deg) }
.pg { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 6px; font: 500 15px var(--label); letter-spacing: .04em; color: var(--muted) }
.pg img { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px rgb(242 242 242 / .3), 0 0 18px rgb(70 70 255 / .5) }
.pg.wip img { opacity: .45; box-shadow: 0 0 0 1px rgb(242 242 242 / .3); filter: grayscale(.6) }
.st { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 8px; font: 600 16px var(--label); letter-spacing: .04em }
.st span.sq { position: relative; width: 64px; height: 64px; border-radius: 18px; background: rgb(10 10 46 / .9); border: 1px solid var(--frame-hi); box-shadow: 0 0 24px rgb(0 0 242 / .45); display: grid; place-items: center }
.st span.sq .ic { width: 28px; height: 28px }
.st span.sq b { position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgb(0 242 121 / .25) }
.crew { position: absolute; transform: translate(-50%, -50%); filter: drop-shadow(0 0 8px rgb(242 242 242 / .35)) }
.chip.to { background: transparent; color: var(--muted) }
@media (max-width: 600px) {
  .sys { width: 360px; height: 360px; top: 44% }
  .sun { width: 128px; height: 128px }
  .sun svg { inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px) }
  .pg img { width: 38px; height: 38px }
  .pg { font-size: 13px }
  .st span.sq { width: 52px; height: 52px; border-radius: 15px }
  .st { font-size: 14px }
  .st.deck { left: 14px !important; top: 14px !important }
  .st.game { right: 14px !important; top: 14px !important }
}
</style></head>
