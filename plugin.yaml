name: swarm-studio
version: 0.3.0
description: "A crew of agents builds a whole launch from one prompt, live on a canvas you can watch and steer: a multi-page website, a working web app with a database, a playable game (also as a Godot, Unity or Unreal project), a promo film and social posts. Builds go to Swarm Feed, where others remix them and every maker is credited."
author: Pukujan
kind: standalone
requires_hermes: ">=0.23"
provides_tools:
  - swarm_design
  - swarm_canvas
  - swarm_studio
provides_hooks:
  - pre_tool_call
optional_env:
  - name: SWARM_STUDIO_API_KEY
    description: "Optional: a key for an OpenAI-compatible chat endpoint, used only when Hermes cannot run the crew's model calls (set SWARM_STUDIO_BASE_URL to change the endpoint; default InferHub)"
    secret: true
  - name: ELEVENLABS_API_KEY
    description: "Optional: ElevenLabs key for the Film studio's music and sound effects (without it the studio writes its own score)"
    secret: true
  - name: CKFF_API_KEY
    description: "Optional: ckff image key, used for pictures when Hermes's image tool cannot paint"
    secret: true
  - name: CKFF_BASE_URL
    description: "Optional: ckff endpoint (default https://ckffai.com/v1)"
  - name: CKFF_MODEL
    description: "Optional: ckff image model"
  - name: MESHY_API_KEY
    description: "Optional: Meshy key for 3D characters (the studio asks before spending credits)"
    secret: true
  - name: PEXELS_API_KEY
    description: "Optional: Pexels key for stand-in photos while pictures are painted"
    secret: true
  - name: PEXELS_OCTO_LEASE
    description: "Optional: an Octo vault lease that reaches Pexels without holding its key"
    secret: true
  - name: OCTO_SWARM_WS
    description: "Optional: Octo workspace key for public copies of stand-in photos"
    secret: true
  - name: OCTO_SWARM_WORKSPACE_ID
    description: "Optional: the Octo workspace those copies go to"
  - name: OCTO_BASE_URL
    description: "Optional: Octo address (default https://octodb.design-bakery.com)"
  - name: SUPABASE_URL
    description: "Optional: a Supabase project for generated apps' data (or connect Supabase through Hermes)"
  - name: SUPABASE_SERVICE_ROLE_KEY
    description: "Optional: that Supabase project's service role key"
    secret: true
  - name: STRIPE_SECRET_KEY
    description: "Optional: a Stripe test key (sk_test_ or rk_test_) for generated apps' checkout; live keys are refused"
    secret: true
  - name: RESEND_API_KEY
    description: "Optional: a Resend key for a generated app's email (sign-in links, receipts), handed only to an app whose locked plan chose Resend; without it, emails go to the app's Outbox"
    secret: true
  - name: VERCEL_TOKEN
    description: "Optional: Vercel token for Publish and app deploys"
    secret: true
  - name: CLOUDFLARE_API_TOKEN
    description: "Optional: Cloudflare token for Publish to Cloudflare Pages"
    secret: true
license: FSL-1.1-ALv2
# Bundled, nothing installed (built by scripts/vendor.mjs, version, licence and SHA-256 beside each):
#   web/vendor/xstate/xstate.mjs   XState 5.33.3 (MIT): the studio page's navigation
#   engine/vendor/procs/procs.mjs  execa 9.6.1 (MIT) and tree-kill 1.2.2 (MIT), with their 22 dependencies (MIT,
#                                  ISC, Apache-2.0; every one pinned in scripts/vendor/procs/package-lock.json):
#                                  the server starts its child processes with execa and stops each with all of
#                                  its children (tree-kill: taskkill /T on Windows, ps/pgrep elsewhere)
